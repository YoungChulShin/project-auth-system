services:
  mysql:
    image: mysql:8.4
    container_name: auth-system-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uauthuser", "-pauthpass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
